
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Become a Seller | UNEST MARKET</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #EAF5FC;
            font-family: Arial, sans-serif;
            color: #102A43;
        }

        .register-container {
            max-width: 470px;
            width: 90%;
            margin: 45px auto;
            padding: 35px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            color: #0284C7;
            font-size: 27px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #64748B;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #CBD5E1;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #0284C7;
            border-color: #0284C7;
        }

        button {
            width: 100%;
            padding: 15px;
            background: #0284C7;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0369A1;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            font-size: 14px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
        }

        .login-link a,
        .home-link {
            color: #0284C7;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <main class="register-container">

        <div class="logo">UNEST MARKET</div>

        <h1>Become a Seller</h1>

        <p class="subtitle">
            Create your seller account and start listing
            your products on UNEST MARKET.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName"
                    placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                    placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone"
                    placeholder="Enter your phone number" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password"
                    placeholder="Create a password"
                    minlength="6" required>
            </div>

            <button type="submit" id="registerButton">
                Create Seller Account
            </button>

            <p id="message"></p>

        </form>

        <div class="login-link">
            Already a seller?
            <a href="login.html">Login</a>
        </div>

        <a href="index.html" class="home-link">
            Back to Homepage
        </a>

    </main>

    <script type="module">
        import { supabase } from "./js/supabase.js";

        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            button.disabled = true;
            button.textContent = "Creating Seller Account...";

            try {
                const fullName =
                    document.getElementById("fullName").value.trim();

                const email =
                    document.getElementById("email").value.trim();

                const phone =
                    document.getElementById("phone").value.trim();

                const password =
                    document.getElementById("password").value;

                const { data, error } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            full_name: fullName,
                            phone: phone,
                            account_type: "seller"
                        }
                    }
                });

                if (error) throw error;

                message.style.color = "green";

                if (data.session) {
                    message.textContent =
                        "Seller account created successfully!";

                    window.location.href = "seller.html";
                } else {
                    message.textContent =
                        "Registration successful! Check your email if confirmation is required, then log in.";
                }

            } catch (error) {
                message.style.color = "red";
                message.textContent = error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Create Seller Account";
            }
        });
    </script>

</body>
</html>
