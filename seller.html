
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard | UNEST MARKET</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            background: #EAF5FC;
            font-family: Arial, sans-serif;
            color: #102A43;
        }

        .dashboard {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            background: white;
            padding: 22px;
            border-radius: 10px;
        }

        .topbar h1 {
            color: #0284C7;
            margin: 0;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .actions a, .logout {
            padding: 12px 17px;
            border: none;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .primary {
            background: #0284C7;
            color: white;
        }

        .secondary {
            background: #E0F2FE;
            color: #075985;
        }

        .logout {
            background: #DC2626;
            color: white;
        }

        .welcome, .products-section {
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 10px;
        }

        .welcome h2 {
            margin-top: 0;
            color: #075985;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            border: 1px solid #CBD5E1;
            border-radius: 9px;
            overflow: hidden;
            background: white;
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background: #E0F2FE;
        }

        .product-info {
            padding: 15px;
        }

        .product-info h3 {
            color: #075985;
            margin-top: 0;
        }

        .price {
            font-size: 19px;
            font-weight: bold;
            color: #0284C7;
        }

        .delete-button {
            width: 100%;
            padding: 11px;
            background: #DC2626;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 12px;
        }

        #dashboardMessage {
            color: #475569;
        }

        @media(max-width: 600px) {
            .dashboard {
                margin: 15px auto;
                padding: 12px;
            }
        }
    </style>
</head>

<body>

<main class="dashboard">

    <header class="topbar">
        <h1>UNEST MARKET</h1>

        <div class="actions">
            <a href="add-product.html" class="primary">Add Product</a>
            <a href="marketplace.html" class="secondary">Marketplace</a>
            <button class="logout" id="logoutButton">Logout</button>
        </div>
    </header>

    <section class="welcome">
        <h2>Seller Dashboard</h2>
        <p id="sellerName">Loading seller information...</p>
        <p>Manage your products and listings here.</p>
    </section>

    <section class="products-section">
        <h2>My Products</h2>
        <p id="dashboardMessage">Loading your products...</p>
        <div class="products-grid" id="myProducts"></div>
    </section>

<section class="products-section">
    <h2>Incoming Orders</h2>
    <p id="ordersMessage">Loading orders...</p>
    <div class="products-grid" id="sellerOrders"></div>
</section>

</main>

<script type="module" src="js/seller-dashboard.js"></script>

</body>
</html>
